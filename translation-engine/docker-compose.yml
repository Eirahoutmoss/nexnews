services:
  nexnews-translate:
    image: libretranslate/libretranslate:latest
    container_name: nexnews-translate
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    command:
      - --load-only
      - en,de,es,fr,it,pt,ar,ru,tr,zh,ja,ko,nl,pl
      - --threads
      - "4"
      - --translation-cache
      - all
